apiVersion: v1
kind: Service
metadata:
  name: {{ include "duks.fullname" . }}-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "duks.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "duks.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
