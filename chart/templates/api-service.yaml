apiVersion: v1
kind: Service
metadata:
  name: {{ include "duks.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "duks.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "duks.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
