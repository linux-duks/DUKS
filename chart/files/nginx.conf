user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
  proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=local_cache:30m max_size=510m inactive=10d;
  proxy_temp_path /tmp/nginx_proxy 1 2;

  # API
  server{
   listen 80;
   server_tokens off;

   absolute_redirect off;
   port_in_redirect off;

   # correctly load css
   include /etc/nginx/mime.types;

   index index.html index.html;

   location /static {
    gzip_static on;
    alias /www/data/; # Static directory's complete path from root
   }

   location /api {
     # compression
     gzip on;
     gzip_types      text/plain application/xml;
     gzip_proxied    any;
     gzip_min_length 100;
     gzip_comp_level 6;
     gzip_vary       on;

     proxy_connect_timeout 300s;
     proxy_send_timeout    300s;
     proxy_read_timeout    300s;

     add_header X-Cache-Status $upstream_cache_status;

     # The upstream host placeholder is replaced at chart render time with
     # "<release>-duks-api:6000" (the api Service of this release).
     proxy_pass http://__API_UPSTREAM__;

     # caching
     proxy_ignore_headers    Expires Cache-Control X-Accel-Expires;
     proxy_ignore_headers    Set-Cookie;
     proxy_cache_methods     GET;
     proxy_cache_valid       200 302 24h;
     proxy_cache_valid       404 1m;
     proxy_cache local_cache;
   }

  # by default, try loading files with .html, .js, .css ext in order
  # all other files should be in static
  location / {
    gzip_static on;
    root /www/data/;
    try_files $uri $uri/ $uri.html $uri.js $uri.css =404;
     # Static directory's complete path from root
   }
  }
}
