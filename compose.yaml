name: linux-duks

services:
  api:
    environment:
      - DEBUG=false
      - DATA_DIR=/data
      - HOME=/tmp
      # Pre-compute the dashboard's known window sizes at startup. Set to
      # "false" to compute them on first request instead.
      - KERNEL_CACHE_WARMUP=${KERNEL_CACHE_WARMUP:-true}
    build:
      context: server/
      dockerfile: Containerfile.prod
    image: duks-server:latest
    volumes:
      - ./data/:/data:z
    ports:
      - 6000:6000
    networks:
      - app_network
    restart: unless-stopped
    command: gunicorn app:app -w 4 --threads 4 -b "0.0.0.0:6000"

  nginx:
    image: docker.io/nginx:1.31-alpine
    ports:
      - "18000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:z
      - ./server/static:/www/data:z
    depends_on:
      - api
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
